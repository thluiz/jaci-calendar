# /etc/nginx/hermes-routes/loopback/calendar-gate.conf
#
# Goes in loopback/, NOT in local/. The local/ directory is included by the
# :8080, :8443 and :18443 server blocks, and :18443 has a Windows portproxy and
# a firewall opening, so it is reachable over ZeroTier from another machine.
# loopback/ is included only from :8080, which iptables restricts to
# 172.16.0.0/12 and the Windows Firewall restricts to the WSL2 subnet.
#
# An `allow`/`deny` by IP would not substitute for this: the Windows portproxy
# NATs, so ZeroTier traffic arrives with a source in the WSL subnet, which is
# indistinguishable from the legitimate one.

location /api/calendar-gate/ {
    proxy_pass http://127.0.0.1:8009/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API key travels in X-Api-Key; nginx forwards it unchanged.
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
